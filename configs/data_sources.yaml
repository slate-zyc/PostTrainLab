# 候选数据目录。revision 固定到 Hugging Face 官方仓库的提交。
# 更换上游提交、目录或指定分片时，递增对应数据集的本地缓存版本。
sample_size: 120
sample_seed: 42
shuffle_buffer: 512

sources:
  HuggingFaceH4/ultrachat_200k:
    revision: 8049631c405ae6576f93f445c6b8166f76f5505a    # 最新一次 Hugging Face 官方仓库的提交，固定数据集版本
    cache_version: v1
    train_split: train_sft    # 以下信息均来自 Hugging Face 官方仓库的 README.md
    test_split: test_sft
    license: MIT
    kind: sft
    audit_fields: [prompt, prompt_id, messages]

  HuggingFaceH4/ultrafeedback_binarized:
    revision: 3949bf5f8c17c394422ccfab0c31ea9c20bdeb85
    cache_version: v1
    train_split: train_prefs
    test_split: test_prefs
    license: MIT
    kind: preference
    audit_fields: [prompt, prompt_id, chosen, rejected, score_chosen, score_rejected]

  Anthropic/hh-rlhf:
    revision: d8d97fe9e96fcd19cc8fc31bd04ee393422abfbb
    cache_version: v1
    data_dir: helpful-base  # 只抽查有帮助性偏好对
    train_split: train
    test_split: test
    license: MIT
    kind: audit
    audit_fields: [chosen, rejected]

  OpenAssistant/oasst1:
    revision: fdf72ae0827c1cda404aff25b6603abec9e3399b
    cache_version: v1
    train_split: train
    license: Apache-2.0
    kind: audit
    audit_fields: [message_id, parent_id, message_tree_id, role, text, lang, rank]
